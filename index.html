<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes chats</title>
<meta name="description" content="Fiches, photos, traitements avec rappels et stocks de nourriture pour les chats du foyer.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mes chats">
<meta name="theme-color" content="#f6f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f6f0e8; --paper:#fffbf6; --fg:#2a221c; --muted:#6c6158; --line:#e3d8cb;
  --acc:#b5602b; --acc-ink:#fff; --acc-soft:#f5e2d3;
  --red:#b8352c; --red-soft:#f7dcd8; --amber:#9a6a00; --amber-soft:#f6ebc9; --ok:#3f7a4a; --ok-soft:#dcebdc;
  --blue:#2f6688; --blue-soft:#dde9f1;
  --shadow:0 1px 2px rgba(50,30,10,.06),0 6px 18px rgba(50,30,10,.07);
  --f-head:"Fraunces",Georgia,serif; --f-body:"Atkinson Hyperlegible",-apple-system,system-ui,sans-serif;
  --r:14px; color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1714; --paper:#24201c; --fg:#efe8e0; --muted:#ab9f94; --line:#3a332c;
  --acc:#e8925a; --acc-ink:#21130a; --acc-soft:#3d2a1e;
  --red:#ef7f74; --red-soft:#43231f; --amber:#e3b54a; --amber-soft:#3b3020; --ok:#85c08f; --ok-soft:#203325;
  --blue:#82b6d6; --blue-soft:#1f3140;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#1a1714; --paper:#24201c; --fg:#efe8e0; --muted:#ab9f94; --line:#3a332c;
  --acc:#e8925a; --acc-ink:#21130a; --acc-soft:#3d2a1e;
  --red:#ef7f74; --red-soft:#43231f; --amber:#e3b54a; --amber-soft:#3b3020; --ok:#85c08f; --ok-soft:#203325;
  --blue:#82b6d6; --blue-soft:#1f3140;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:650;letter-spacing:-.01em;margin:0}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);
  border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:42px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.icon{width:20px;height:20px;flex:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font-size:30px;line-height:1.1;flex:1;min-width:0}
.top h1 small{display:block;font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

/* navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;max-width:180px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:700;position:relative}
.nav button[aria-current="page"]{color:var(--acc);background:var(--acc-soft)}
.nav .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}

/* chats */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
@media (max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:10px}.card h3{font-size:18px}.card .body{padding:10px}}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;text-align:left;border:0;padding:0}
.ph{aspect-ratio:1;background:var(--acc-soft);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--acc)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .ph img{transform:scale(1.03)}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.red{background:var(--red);color:#fff}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.card .body{padding:12px 14px 14px}
.card h3{font-size:21px;margin-bottom:2px}
.meta{color:var(--muted);font-size:14px}
.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--paper);border-radius:var(--r)}

/* listes soins / stocks */
.group{margin:18px 0 8px;font:700 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{display:grid;gap:10px}
.item{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.item .av{width:44px;height:44px;border-radius:999px;background:var(--acc-soft);overflow:hidden;display:grid;place-items:center;color:var(--acc);font-weight:700}
.item .av img{width:100%;height:100%;object-fit:cover}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:14px}
.item.clic{cursor:pointer}
.when{font-weight:700;font-size:14px;white-space:nowrap}
.when.late{color:var(--red)} .when.soon{color:var(--amber)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--line);color:var(--fg);display:inline-block}
.tag.vermifuge{background:var(--amber-soft);color:var(--amber)}
.tag.antiparasitaire{background:var(--ok-soft);color:var(--ok)}
.tag.vaccin{background:var(--blue-soft);color:var(--blue)}
.tag.medicament{background:var(--red-soft);color:var(--red)}
.tag.soin{background:var(--acc-soft);color:var(--acc)}

.stock{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stock-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stock-h h3{font-size:20px;flex:1;min-width:0}
.gauge{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 8px}
.gauge i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.gauge.amber i{background:var(--amber)} .gauge.red i{background:var(--red)}
.stock-n{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.stock-n b{color:var(--fg);font-size:16px}
.stock .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* panneau */
.sheet{position:fixed;inset:0;background:rgba(20,14,8,.45);display:flex;justify-content:center;align-items:flex-end;z-index:20}
@media (min-width:760px){.sheet{align-items:center;padding:24px}}
.panel{background:var(--bg);width:100%;max-width:760px;max-height:100%;overflow:auto;border-radius:18px 18px 0 0;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
@media (min-width:760px){.panel{border-radius:18px;max-height:calc(100vh - 48px)}}
.panel-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{flex:1;font-size:22px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-body{padding:16px}
.hero{border-radius:var(--r);overflow:hidden;background:var(--acc-soft);aspect-ratio:4/3;max-height:60vh;width:100%;display:grid;place-items:center;position:relative;color:var(--acc)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--paper);border-radius:12px;padding:10px 12px}
.fact span{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fact strong{font-size:16px;word-break:break-word}
.section-title{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.section-title h3{font-size:20px;flex:1}
.notes{white-space:pre-wrap;background:var(--paper);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:8px}
.notes b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.gallery button{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--acc-soft);cursor:pointer;position:relative}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .star{position:absolute;right:4px;top:4px;background:var(--acc);color:var(--acc-ink);border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px}
.chart{background:var(--paper);border-radius:12px;padding:10px 12px}
.chart>svg{width:100%;height:150px;display:block}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:15px}
.hist li .d{font-weight:700;min-width:96px}
.hist li .x{flex:1;color:var(--muted)}
.fold{background:var(--paper);border-radius:12px;margin:12px 0;box-shadow:var(--shadow)}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:52px}
.fold summary::-webkit-details-marker{display:none}
.fold .ft{font:650 19px var(--f-head)}
.fold .fr{flex:1;text-align:right;color:var(--muted);font-size:14px;font-weight:700}
@media (max-width:480px){.fold summary{flex-wrap:wrap}.fold .fr{order:3;flex-basis:100%;text-align:left;margin-top:-6px}}
.fold .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 2px;transition:transform .2s}
.fold[open] .chev{transform:rotate(-135deg);margin-top:4px}
.fold-b{padding:0 14px 12px}
.fold-b .chart{padding:0;background:none}
.fold-b .hist li.more{display:none}
.fold-b.all .hist li.more{display:flex}
.tag.rdv{background:var(--blue-soft);color:var(--blue)}
.tag.entretien{background:var(--ok-soft);color:var(--ok)}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted);min-width:36px;min-height:36px}
.iconbtn:hover{background:var(--paper);color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow-x:auto;background:var(--paper);scrollbar-width:none}
.seg button{white-space:nowrap;flex:1 0 auto;border:0;background:transparent;padding:8px 14px;font-weight:700;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

form.f{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.field small{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field textarea{min-height:80px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
legend{font:650 18px var(--f-head);margin:8px 0 4px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.foot .spacer{flex:1}
.err{color:var(--red);font-size:14px;min-height:1em;margin:0}
.box{background:var(--paper);border-radius:12px;padding:14px;margin-bottom:12px}
.box h3{font-size:18px;margin-bottom:6px}
.box p{margin:0 0 10px;color:var(--muted);font-size:15px}
.code{font:700 26px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;background:var(--bg);border-radius:10px;padding:12px;text-align:center;margin:8px 0}

.auth{max-width:400px;margin:10vh auto 0;padding:24px;background:var(--paper);border-radius:18px;box-shadow:var(--shadow)}
.auth h1{font-size:28px;margin-bottom:6px}
.auth p{color:var(--muted);margin:0 0 16px}
.linkbtn{border:0;background:none;color:var(--acc);font-weight:700;cursor:pointer;padding:6px 0}

.viewer{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbar{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));color:#eee;flex-wrap:wrap}
.viewer .vbar .cap{flex:1;min-width:150px;font-size:14px}
.viewer .btn{background:#222;border-color:#444;color:#eee}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
.status{font-size:13px;color:var(--muted)}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(80px + env(safe-area-inset-bottom));z-index:16;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Connexion -->
<section id="auth" class="wrap" hidden>
  <div class="auth">
    <h1 id="authTitle">Mes chats</h1>
    <p id="authSub">Fiches, traitements et stocks, partagés avec le foyer.</p>
    <form id="authForm" class="f">
      <label class="field" id="authEmailF"><span>E-mail</span><input id="authEmail" type="email" autocomplete="email" required></label>
      <label class="field" id="authPwF"><span>Mot de passe</span><input id="authPw" type="password" autocomplete="current-password"></label>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn pri" id="authGo" type="submit">Se connecter</button>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <button class="linkbtn" type="button" id="authForgot">Mot de passe oublié ?</button>
        <button class="linkbtn" type="button" id="authAlt">Créer un compte</button>
      </div>
    </form>
  </div>
</section>

<!-- Premier lancement : créer ou rejoindre le foyer -->
<section id="onb" class="wrap" hidden>
  <div class="auth">
    <h1>Votre foyer</h1>
    <p>Les chats, traitements et stocks sont partagés entre les membres du foyer.</p>
    <form id="onbForm" class="f">
      <label class="field"><span>Votre prénom</span><input id="onbPrenom" autocomplete="given-name" required></label>
      <div class="seg" role="group" aria-label="Choix">
        <button type="button" data-o="creer" aria-pressed="true">Créer le foyer</button>
        <button type="button" data-o="rejoindre" aria-pressed="false">Rejoindre avec un code</button>
      </div>
      <label class="field" id="onbNomF"><span>Nom du foyer</span><input id="onbNom" placeholder="Ex. Maison Illkirch"></label>
      <label class="field" id="onbCodeF" hidden><span>Code d'invitation</span><input id="onbCode" autocapitalize="characters" autocomplete="off" placeholder="8 caractères"></label>
      <p class="err" id="onbErr" role="alert"></p>
      <button class="btn pri" type="submit" id="onbGo">Continuer</button>
      <button class="linkbtn" type="button" id="onbOut">Se déconnecter</button>
    </form>
  </div>
</section>

<!-- Application -->
<main id="app" class="wrap" hidden>
  <header class="top">
    <h1><small id="sub">Foyer</small><span id="title">Mes chats</span></h1>
    <button class="btn" id="acctBtn" type="button" aria-label="Foyer, notifications et compte">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>Réglages</span>
    </button>
  </header>
  <section id="vChats"></section>
  <section id="vSoins" hidden></section>
  <section id="vStocks" hidden></section>
  <button class="btn pri fab" id="addBtn" type="button">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span id="addLbl">Ajouter</span>
  </button>
</main>

<nav class="nav" id="nav" hidden aria-label="Sections">
  <button data-v="chats" aria-current="page">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4l4 4h8l4-4v9a8 8 0 01-16 0z"/><circle cx="9" cy="13" r="1" fill="currentColor"/><circle cx="15" cy="13" r="1" fill="currentColor"/></svg>Chats</button>
  <button data-v="soins">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-40 12 12)"/><path d="M9.5 9l5 6"/></svg>Soins<span class="dot" id="dotSoins" hidden></span></button>
  <button data-v="stocks">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l1 4v13a1 1 0 01-1 1H6a1 1 0 01-1-1V7z"/><path d="M5 7h14M10 12h4"/></svg>Stocks<span class="dot" id="dotStocks" hidden></span></button>
</nav>

<div id="sheet" class="sheet" hidden></div>
<div id="viewer" class="viewer" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
